name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changesets:
    name: Version PR / publish gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      needs-publish: ${{ steps.gate.outputs.needs-publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so Changesets attributes changelog entries to the right commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the version on main is already published
        id: gate
        run: |
          version="$(jq -r .version packages/coily/package.json)"
          if npm view "coily@${version}" version >/dev/null 2>&1; then
            echo "coily@${version} is already on npm; no publish needed"
            echo "needs-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "coily@${version} is not on npm yet"
            echo "needs-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Events made with GITHUB_TOKEN never start other workflows, so a Version
      # Packages PR opened with it gets no CI. An app token's events do.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the changeset-release/main branch
          permission-pull-requests: write # open and update the Version Packages PR

      - name: Maintain Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
          github-token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to npm
    needs: changesets
    if: needs.changesets.outputs.has-changesets == 'false' && needs.changesets.outputs.needs-publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/coily
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: write # changesets/action pushes git tags and creates the GitHub Release
      id-token: write # OIDC token exchange for npm trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Require npm with trusted-publishing support
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm ${current} predates trusted publishing support (need >= ${required})" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm turbo run check build test

      # TEMPORARY: diagnose the trusted-publishing 404. changesets hides pnpm's
      # "Skipped OIDC" warning, so do the exchange here and print npm's answer
      # (never the token). Remove once publishing works.
      - name: Diagnose npm trusted publishing
        continue-on-error: true
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
            url.searchParams.set("audience", "npm:registry.npmjs.org")
            const idRes = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            })
            console.log("GitHub id-token request:", idRes.status)
            const { value } = await idRes.json()
            const c = JSON.parse(Buffer.from(value.split(".")[1], "base64url"))
            console.log("claims:", JSON.stringify({
              aud: c.aud, repository: c.repository, repository_owner: c.repository_owner,
              workflow_ref: c.workflow_ref, job_workflow_ref: c.job_workflow_ref,
              environment: c.environment, ref: c.ref, event_name: c.event_name,
            }, null, 2))
            const ex = await fetch(
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/coily",
              { method: "POST", headers: { Authorization: `Bearer ${value}` } },
            )
            console.log("npm token exchange:", ex.status, ex.ok ? "(token received, not printed)" : await ex.text())
          '
          cd packages/coily && pnpm publish --dry-run --no-git-checks

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm exec changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
